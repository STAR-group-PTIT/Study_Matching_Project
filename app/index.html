<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusFlow</title>
    <script>
      // Set data-theme before first paint so switching to dark mode doesn't flash light
      // first — must stay in sync with the fallback logic in src/store/theme.ts.
      ;(function () {
        try {
          var t = localStorage.getItem('ff-theme')
          if (t !== 'light' && t !== 'dark') {
            t = 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
